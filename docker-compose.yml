services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-churn_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-matrisk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data, ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    ports: ["127.0.0.1:${APP_PORT:-8501}:8501", "127.0.0.1:${API_PORT:-8000}:8000"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-churn_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-matrisk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MATRISK_CA_BUNDLE: ${MATRISK_CA_BUNDLE-}
    volumes:
      - app_data:/app/data
      - app_artifacts:/app/artifacts
      - ./certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["sh","-c","streamlit run app.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true & uvicorn src.api:app --host 0.0.0.0 --port 8000"]
    restart: unless-stopped
volumes:
  postgres_data:
  app_data:
  app_artifacts:
